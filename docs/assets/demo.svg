<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1398" viewBox="0 0 1000 1398">
<rect x="0" y="0" width="1000" height="1398" rx="24" fill="#0d1117"/>
<defs><linearGradient id="hero" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1d4ed8" stop-opacity="0.33"/><stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.20"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0.16"/></linearGradient></defs>
<rect x="0" y="0" width="1000" height="1398" rx="24" fill="url(#hero)"/>
<text x="28" y="44" fill="#c9d1d9" font-size="26" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800">PromptPilot visual demo</text>
<text x="28" y="72" fill="#8b949e" font-size="14" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">A vague ask becomes a precise brief — it asks one sharp question first, instead of burning an agent run on a guess.</text>
<rect x="852" y="30" width="120" height="24" rx="12" fill="#7ee787" fill-opacity="0.14" stroke="#7ee787" stroke-opacity="0.55"/>
<text x="912" y="46" fill="#7ee787" font-size="12" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" text-anchor="middle">real SLM</text>
<rect x="754" y="30" width="86" height="24" rx="12" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.55"/>
<text x="797" y="46" fill="#58a6ff" font-size="12" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" text-anchor="middle">gpt-5.2</text>
<rect x="88" y="104" width="884" height="84" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="88" y="104" width="5" height="84" rx="2.5" fill="#58a6ff"/>
<circle cx="52" cy="128" r="14" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-opacity="0.7"/>
<text x="52" y="133" fill="#58a6ff" font-size="14" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" text-anchor="middle">1</text>
<text x="106" y="130" fill="#c9d1d9" font-size="14" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700">You type</text>
<text x="106" y="152" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">the checkout page is slow, make it faster</tspan></text>
<line x1="52" y1="192" x2="52" y2="218" stroke="#6e7681" stroke-width="2"/>
<path d="M 47 211 L 52 218 L 57 211" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="214" fill="#8b949e" font-size="12" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">PromptPilot routes the request</text>
<rect x="88" y="222" width="884" height="254" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="88" y="222" width="5" height="254" rx="2.5" fill="#e3b341"/>
<circle cx="52" cy="246" r="14" fill="#e3b341" fill-opacity="0.16" stroke="#e3b341" stroke-opacity="0.7"/>
<text x="52" y="251" fill="#e3b341" font-size="14" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" text-anchor="middle">2</text>
<text x="106" y="248" fill="#c9d1d9" font-size="14" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700">PromptPilot  ·  asks instead of guessing</text>
<rect x="868" y="233" width="86" height="24" rx="12" fill="#e3b341" fill-opacity="0.14" stroke="#e3b341" stroke-opacity="0.55"/>
<text x="911" y="249" fill="#e3b341" font-size="12" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" text-anchor="middle">route=clarify</text>
<text x="106" y="270" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">What part of the checkout page is slow (pick one)?</tspan></text>
<text x="106" y="292" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#56d4dd" xml:space="preserve">  A) </tspan><tspan fill="#c9d1d9" xml:space="preserve">Initial page load / TTFB</tspan></text>
<text x="106" y="314" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#56d4dd" xml:space="preserve">  B) </tspan><tspan fill="#c9d1d9" xml:space="preserve">Client-side rendering / JS bundle</tspan></text>
<text x="106" y="336" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#56d4dd" xml:space="preserve">  C) </tspan><tspan fill="#c9d1d9" xml:space="preserve">API calls during checkout (shipping/tax/payment)</tspan></text>
<text x="106" y="358" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#56d4dd" xml:space="preserve">  D) </tspan><tspan fill="#c9d1d9" xml:space="preserve">Third-party scripts (payment, analytics)</tspan></text>
<text x="106" y="380" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#56d4dd" xml:space="preserve">  E) </tspan><tspan fill="#c9d1d9" xml:space="preserve">Database queries/server render</tspan></text>
<text x="106" y="418" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">Share a URL/route name and any metrics (LCP/TTFB), plus whether you mean web, mobile web, or</tspan></text>
<text x="106" y="440" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">app.</tspan></text>
<line x1="52" y1="480" x2="52" y2="506" stroke="#6e7681" stroke-width="2"/>
<path d="M 47 499 L 52 506 L 57 499" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="502" fill="#8b949e" font-size="12" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">you answer in one line</text>
<rect x="88" y="510" width="884" height="106" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="88" y="510" width="5" height="106" rx="2.5" fill="#58a6ff"/>
<circle cx="52" cy="534" r="14" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-opacity="0.7"/>
<text x="52" y="539" fill="#58a6ff" font-size="14" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" text-anchor="middle">3</text>
<text x="106" y="536" fill="#c9d1d9" font-size="14" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700">You answer</text>
<text x="106" y="558" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">It's the database queries — they're slow on big carts. Keep the public API and behavior the</tspan></text>
<text x="106" y="580" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">same, and make sure it's tested.</tspan></text>
<line x1="52" y1="620" x2="52" y2="646" stroke="#6e7681" stroke-width="2"/>
<path d="M 47 639 L 52 646 L 57 639" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="642" fill="#8b949e" font-size="12" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">PromptPilot routes the request</text>
<rect x="88" y="650" width="884" height="654" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="88" y="650" width="5" height="654" rx="2.5" fill="#7ee787"/>
<circle cx="52" cy="674" r="14" fill="#7ee787" fill-opacity="0.16" stroke="#7ee787" stroke-opacity="0.7"/>
<text x="52" y="679" fill="#7ee787" font-size="14" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-weight="800" text-anchor="middle">4</text>
<text x="106" y="676" fill="#c9d1d9" font-size="14" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700">PromptPilot  ·  forwards a precise brief to the coding agent</text>
<rect x="868" y="661" width="86" height="24" rx="12" fill="#7ee787" fill-opacity="0.14" stroke="#7ee787" stroke-opacity="0.55"/>
<text x="911" y="677" fill="#7ee787" font-size="12" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-weight="700" text-anchor="middle">route=act</text>
<text x="106" y="698" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#8b949e" xml:space="preserve">task=</tspan><tspan fill="#d2a8ff" xml:space="preserve">bug_fix</tspan><tspan fill="#8b949e" xml:space="preserve">   confidence=</tspan><tspan fill="#d2a8ff" xml:space="preserve">medium</tspan></text>
<text x="106" y="736" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">Checkout page is slow due to database queries on large carts. Optimize the slow DB queries</tspan></text>
<text x="106" y="758" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">used during checkout for big carts while keeping the public API and all user-visible</tspan></text>
<text x="106" y="780" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">behavior exactly the same.</tspan></text>
<text x="106" y="818" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">Requirements:</tspan></text>
<text x="106" y="840" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">- Identify which queries are slow on the checkout flow for large carts (use</tspan></text>
<text x="106" y="862" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">profiling/logging or inspecting ORM query patterns).</tspan></text>
<text x="106" y="884" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">- Reduce query count and/or query cost (e.g., eliminate N+1s, add/adjust eager-loading,</tspan></text>
<text x="106" y="906" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">rewrite inefficient joins/subqueries, add/adjust indexes, batch/aggregate queries, avoid</tspan></text>
<text x="106" y="928" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">per-line-item queries).</tspan></text>
<text x="106" y="950" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">- Do not change request/response schemas, endpoints, or business logic outputs; behavior</tspan></text>
<text x="106" y="972" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">must remain identical.</tspan></text>
<text x="106" y="994" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">- Add/extend automated tests to cover big-cart scenarios and to prevent regressions</tspan></text>
<text x="106" y="1016" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">(functional correctness; optionally performance-guard style tests if the repo supports it).</tspan></text>
<text x="106" y="1054" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">Process:</tspan></text>
<text x="106" y="1076" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">1) Locate the checkout route/controller/service and the code path that fetches cart, line</tspan></text>
<text x="106" y="1098" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">items, pricing, inventory, shipping/tax inputs, etc.</tspan></text>
<text x="106" y="1120" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">2) Reproduce/construct a large cart case in tests/fixtures.</tspan></text>
<text x="106" y="1142" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">3) Optimize the DB interactions.</tspan></text>
<text x="106" y="1164" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">4) Ensure all tests pass; add new tests for the large cart query behavior/correctness.</tspan></text>
<text x="106" y="1202" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">Deliverable: code changes + tests demonstrating the optimization without changing public</tspan></text>
<text x="106" y="1224" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#c9d1d9" xml:space="preserve">API/behavior.</tspan></text>
<text x="106" y="1246" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#8b949e" xml:space="preserve">[cwd=/home/dev/payments-api; Python; branch=main; tests=pytest; changed: api/checkout.py,</tspan></text>
<text x="106" y="1268" fill="#c9d1d9" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#8b949e" xml:space="preserve">tests/test_checkout.py]</tspan></text>
<rect x="88" y="1326" width="884" height="44" rx="14" fill="#052e2b" fill-opacity="0.85" stroke="#7ee787" stroke-opacity="0.45"/>
<text x="108" y="1353" fill="#c9d1d9" font-size="14" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif"><tspan fill="#7ee787" xml:space="preserve">✓ </tspan><tspan fill="#c9d1d9" xml:space="preserve">A vague ask earns one sharp question — not a wrong guess — then a constraint-pinned brief, forwarded to the agent once.</tspan></text>
</svg>
